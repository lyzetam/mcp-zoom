[project]
name = "mcp-zoom"
version = "0.1.0"
description = "MCP Server for Zoom Meetings via Composio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Landry Zetam", email = "landry@lztechnology.io" }
]
keywords = ["mcp", "zoom", "meetings", "composio"]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
